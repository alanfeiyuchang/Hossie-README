<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2688" height="1242" viewBox="0 0 2688 1242">
  <defs>
    <linearGradient id="felt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1F14"/>
      <stop offset="55%" stop-color="#0F2E1F"/>
      <stop offset="100%" stop-color="#06180D"/>
    </linearGradient>

    <radialGradient id="spotlightLeft" cx="30%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#1F5635" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F2E1F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="spotlightTitle" cx="68%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#3E2A06" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0F2E1F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="35%" stop-color="#F4D684"/>
      <stop offset="55%" stop-color="#E1B14A"/>
      <stop offset="80%" stop-color="#B98620"/>
      <stop offset="100%" stop-color="#7E5A11"/>
    </linearGradient>

    <linearGradient id="goldThin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7E5A11"/>
      <stop offset="50%" stop-color="#F4D684"/>
      <stop offset="100%" stop-color="#7E5A11"/>
    </linearGradient>

    <linearGradient id="cardFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFE6D2"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <symbol id="card" viewBox="0 0 280 410">
      <rect x="3" y="3" width="274" height="404" rx="26" ry="26" fill="url(#cardFill)" stroke="#C9B989" stroke-width="3"/>
      <rect x="14" y="14" width="252" height="382" rx="18" ry="18" fill="none" stroke="#E8DFC7" stroke-width="1.5"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="2688" height="1242" fill="url(#felt)"/>
  <rect width="2688" height="1242" fill="url(#spotlightLeft)"/>
  <rect width="2688" height="1242" fill="url(#spotlightTitle)"/>

  <!-- Sparkle dots -->
  <g fill="#F4D684" opacity="0.22">
    <circle cx="220" cy="180" r="3"/>
    <circle cx="380" cy="320" r="2.2"/>
    <circle cx="160" cy="500" r="2.8"/>
    <circle cx="2480" cy="220" r="3"/>
    <circle cx="2580" cy="420" r="2"/>
    <circle cx="2400" cy="980" r="2.5"/>
    <circle cx="2540" cy="1080" r="3"/>
    <circle cx="180" cy="1020" r="2"/>
    <circle cx="320" cy="1140" r="2.5"/>
    <circle cx="2200" cy="120" r="2"/>
    <circle cx="100" cy="700" r="2.5"/>
    <circle cx="2620" cy="700" r="2"/>
  </g>

  <!-- Gold corner brackets -->
  <g stroke="url(#goldThin)" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M 70 70 L 240 70 M 70 70 L 70 240"/>
    <path d="M 2618 70 L 2448 70 M 2618 70 L 2618 240"/>
    <path d="M 70 1172 L 240 1172 M 70 1172 L 70 1002"/>
    <path d="M 2618 1172 L 2448 1172 M 2618 1172 L 2618 1002"/>
  </g>

  <!-- Card fan: pivot at (700, 1180), cards hang above -->
  <g transform="translate(700 1180)" filter="url(#cardShadow)">
    <!-- Card 1: 9 of spades -->
    <g transform="rotate(-36) translate(-140 -780)">
      <use href="#card" width="280" height="410"/>
      <text x="40" y="78" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#0A1F14">9</text>
      <text x="40" y="138" font-family="Arial, sans-serif" font-size="58" fill="#0A1F14">♠</text>
      <text x="140" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="140" fill="#0A1F14">♠</text>
      <text x="240" y="372" text-anchor="end" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#0A1F14" transform="rotate(180 240 372)">9</text>
      <text x="240" y="312" text-anchor="end" font-family="Arial, sans-serif" font-size="58" fill="#0A1F14" transform="rotate(180 240 312)">♠</text>
    </g>

    <!-- Card 2: 10 of hearts -->
    <g transform="rotate(-22) translate(-140 -780)">
      <use href="#card" width="280" height="410"/>
      <text x="40" y="78" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#D93333">10</text>
      <text x="40" y="138" font-family="Arial, sans-serif" font-size="58" fill="#D93333">♥</text>
      <text x="140" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="140" fill="#D93333">♥</text>
      <text x="240" y="372" text-anchor="end" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#D93333" transform="rotate(180 240 372)">10</text>
      <text x="240" y="312" text-anchor="end" font-family="Arial, sans-serif" font-size="58" fill="#D93333" transform="rotate(180 240 312)">♥</text>
    </g>

    <!-- Card 3: J clubs (left bower) -->
    <g transform="rotate(-8) translate(-140 -780)">
      <use href="#card" width="280" height="410"/>
      <text x="40" y="78" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#0A1F14">J</text>
      <text x="40" y="138" font-family="Arial, sans-serif" font-size="58" fill="#0A1F14">♣</text>
      <text x="140" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="150" fill="#0A1F14">♣</text>
      <text x="240" y="372" text-anchor="end" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#0A1F14" transform="rotate(180 240 372)">J</text>
      <text x="240" y="312" text-anchor="end" font-family="Arial, sans-serif" font-size="58" fill="#0A1F14" transform="rotate(180 240 312)">♣</text>
    </g>

    <!-- Card 4: J diamonds (right bower) - GOLD HIGHLIGHTED -->
    <g transform="rotate(8) translate(-140 -780)">
      <use href="#card" width="280" height="410"/>
      <rect x="9" y="9" width="262" height="392" rx="24" ry="24" fill="none" stroke="url(#goldShine)" stroke-width="5"/>
      <text x="40" y="78" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#D93333">J</text>
      <text x="40" y="138" font-family="Arial, sans-serif" font-size="58" fill="#D93333">♦</text>
      <text x="140" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="150" fill="#D93333">♦</text>
      <text x="240" y="372" text-anchor="end" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#D93333" transform="rotate(180 240 372)">J</text>
      <text x="240" y="312" text-anchor="end" font-family="Arial, sans-serif" font-size="58" fill="#D93333" transform="rotate(180 240 312)">♦</text>
      <!-- Tiny crown for the trump -->
      <path d="M 110 356 L 122 332 L 140 348 L 158 332 L 170 356 Z" fill="url(#goldShine)" stroke="#7E5A11" stroke-width="1.5"/>
    </g>

    <!-- Card 5: K spades -->
    <g transform="rotate(22) translate(-140 -780)">
      <use href="#card" width="280" height="410"/>
      <text x="40" y="78" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#0A1F14">K</text>
      <text x="40" y="138" font-family="Arial, sans-serif" font-size="58" fill="#0A1F14">♠</text>
      <text x="140" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="150" fill="#0A1F14">♠</text>
      <text x="240" y="372" text-anchor="end" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#0A1F14" transform="rotate(180 240 372)">K</text>
      <text x="240" y="312" text-anchor="end" font-family="Arial, sans-serif" font-size="58" fill="#0A1F14" transform="rotate(180 240 312)">♠</text>
    </g>

    <!-- Card 6: A hearts -->
    <g transform="rotate(36) translate(-140 -780)">
      <use href="#card" width="280" height="410"/>
      <text x="40" y="78" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#D93333">A</text>
      <text x="40" y="138" font-family="Arial, sans-serif" font-size="58" fill="#D93333">♥</text>
      <text x="140" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="180" fill="#D93333">♥</text>
      <text x="240" y="372" text-anchor="end" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#D93333" transform="rotate(180 240 372)">A</text>
      <text x="240" y="312" text-anchor="end" font-family="Arial, sans-serif" font-size="58" fill="#D93333" transform="rotate(180 240 312)">♥</text>
    </g>
  </g>

  <!-- Right side: title block -->
  <g transform="translate(1380 0)">
    <!-- Eyebrow line -->
    <g transform="translate(0 280)">
      <line x1="0" y1="0" x2="100" y2="0" stroke="url(#goldThin)" stroke-width="3"/>
      <text x="120" y="14" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#F4D684" letter-spacing="8">A TRICK-TAKING CARD GAME</text>
    </g>

    <!-- HOSSIE wordmark -->
    <text x="0" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="240" font-weight="bold" fill="url(#goldShine)" letter-spacing="-1">HOSSIE</text>

    <!-- Tagline -->
    <text x="0" y="640" font-family="Georgia, serif" font-style="italic" font-size="78" fill="#FAF5EB">Luck and Decision.</text>

    <!-- Feature bullets -->
    <g transform="translate(0 760)" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#FAF5EB">
      <g transform="translate(0 0)">
        <circle cx="14" cy="-14" r="9" fill="#F4D684"/>
        <text x="50" y="0">2v2 partners · 24 cards · 6 tricks per round</text>
      </g>
      <g transform="translate(0 70)">
        <circle cx="14" cy="-14" r="9" fill="#F4D684"/>
        <text x="50" y="0">High · Low · Jack-of-suit modes with bowers</text>
      </g>
      <g transform="translate(0 140)">
        <circle cx="14" cy="-14" r="9" fill="#F4D684"/>
        <text x="50" y="0">Solo vs bots · Local LAN · Online rooms</text>
      </g>
      <g transform="translate(0 210)">
        <circle cx="14" cy="-14" r="9" fill="#F4D684"/>
        <text x="50" y="0">English · 简体中文 · iPhone &amp; iPad</text>
      </g>
    </g>
  </g>

  <!-- Vignette -->
  <rect width="2688" height="1242" fill="url(#vignette)" pointer-events="none"/>
</svg>
